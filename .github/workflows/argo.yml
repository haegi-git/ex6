name: GitOps ArgoCD CI/CD pipeline
on:
  push:
    branches:
      - main
jobs:
  build-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # runs-on에 정의된 서버가 깃에 업로드된 파일을 수정할 수 있도록 (deployment.yaml의 image 태그 자동 수정)
    steps:
      - name: 소스코드 체크아웃 # 깃에 푸시된 파일을 서버에 복사
        uses: actions/checkout@v4

      - name: Docker hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker 이미지 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          file: ./nginx/Dockerfile # Dockerfile 경로 및 파일명
          push: true
          tags: haegihaegi/nginx:${{ github.sha }} # (중요) 태그 자동생성 (ex. haegihaegi/nginx:1.31.3-cd)

      # GitOps 핵심: 이미지만 Hub 에 올리면 클러스터는 모름
      # Deployment YAML 의 image: 를 방금 푸시한 태그(커밋 SHA)로 바꾸고
      # 그 YAML 을 다시 git push → Argo CD 가 Git 변경을 보고 파드를 롤아웃
      # kubectl apply 를 Actions 가 직접 안 함. Git 이 배포 트리거
      - name: 쿠버네티스 파일의 이미지 태그 갱신 및 git 푸시
        run: |
          # 이 커밋의 작성자를 봇으로 표시. 없으면 git commit 이 실패할 수 있음
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # sed: deployment.yaml 안에서
          #   image: haegihaegi/nginx:(아무 태그)
          # 를
          #   image: haegihaegi/nginx:<이번 커밋 SHA>
          # 로 바꿈. 위 스텝 tags 와 같아야 파드가 그 이미지를 pull
          # -i = 파일에 바로 저장. | 는 구분자 (경로에 / 가 많아서)
          sed -i "s|image: haegihaegi/nginx:.*|image: haegihaegi/nginx:${{ github.sha }}|g" ./k8s/deployment.yaml

          git add ./k8s/deployment.yaml
          git commit -m "Update image tag to ${{ github.sha }}"
          # contents: write 권한이 있어야 origin 에 푸시됨
          # 이 푸시도 push 트리거라 워크플로가 한 번 더 돌 수 있음 (봇 커밋 루프 주의)
          git push